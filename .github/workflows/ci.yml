name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docker-compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SEED_LOCAL_DEMO_USERS: "true"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - run: docker compose config --quiet
      - run: docker compose up --build --detach
      - name: Verify first-run setup
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4000/ >/dev/null && \
               curl --fail --silent \
                 --header 'Content-Type: application/json' \
                 --data '{"email":"admin@example.com","password":"Local-Seed-42!"}' \
                 http://127.0.0.1:4001/api/auth/login >/dev/null; then
              exit 0
            fi
            sleep 3
          done
          docker compose ps
          docker compose logs
          exit 1
      - name: Verify same-origin API and non-root runtime
        run: |
          curl --fail --silent --header 'Content-Type: application/json' --data '{"email":"admin@example.com","password":"Local-Seed-42!"}' http://127.0.0.1:4000/api/auth/login > /dev/null
          curl --fail --silent --head http://127.0.0.1:4001/api/health/ready | grep --ignore-case 'cache-control: no-store, private'
          test "$(docker compose exec -T backend id -u)" != "0"
          test "$(docker compose exec -T frontend id -u)" != "0"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: demo/package-lock.json
      - name: Verify live API and warehouse lifecycle
        env:
          WMS_E2E_WRITE_URL: http://127.0.0.1:4001/api
        run: |
          node backend/scripts/live-api-e2e.mjs
          node --test backend/scripts/warehouse-lifecycle.test.mjs
      - name: Verify the live workspace for each seeded role
        working-directory: demo
        env:
          WMS_LIVE_UI_URL: http://127.0.0.1:4000/
        run: |
          npm ci --ignore-scripts
          node node_modules/@playwright/test/cli.js install --with-deps chromium
          node node_modules/@playwright/test/cli.js test live --workers=1 --reporter=line
      - if: failure()
        run: |
          docker compose ps
          docker compose logs
      - if: always()
        run: docker compose down --volumes

  backend:
    services:
      regression-postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: regression-test-only
          POSTGRES_DB: wms_regressions
        ports: ['5432']
        options: --health-cmd "pg_isready -U postgres -d wms_regressions" --health-interval 5s --health-timeout 5s --health-retries 15
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Connect to the PostgreSQL service port
        env:
          TEST_DB_PORT: ${{ job.services.regression-postgres.ports[5432] }}
        run: |
          test -n "$TEST_DB_PORT"
          url="postgresql://postgres:regression-test-only@127.0.0.1:$TEST_DB_PORT/wms_regressions"
          printf 'DATABASE_URL=%s\nWMS_TEST_DATABASE_URL=%s\n' "$url" "$url" >> "$GITHUB_ENV"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run verify
      - run: npm run prisma:deploy
      - run: node --test scripts/transaction-regressions.test.mjs
      - run: node --env-file=.env.example ./node_modules/ts-node/dist/bin.js --project tsconfig.scripts.json --transpile-only scripts/export-openapi.ts
      - run: node ../scripts/Check-AardvarklandFrontendOpenApiContract.mjs
      - name: Test every documented API operation on PostgreSQL
        env:
          SEED_LOCAL_DEMO_USERS: "true"
        run: |
          node --env-file=.env.example ./node_modules/tsx/dist/cli.mjs prisma/seed.ts
          node --env-file=.env.example --test scripts/api-operations.test.mjs

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test

  print-agent:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: print-agent
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: print-agent/package-lock.json
      - run: npm ci
      - run: npm run check
